<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MenuEngine · Weekly Menu</title>
<style>
  :root{
    --bg:#fff7f0; --card:#fff; --ink:#2b2b2b; --muted:#8a8175;
    --accent:#ff7a1a; --accent-soft:#fff0e4; --line:#efe6da;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
    --thai:#e35d6a; --chinese:#d4a017; --japanese:#5b8def; --american:#3aa76d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.45}
  header{text-align:center;padding:26px 18px 8px}
  header .kicker{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:1px;text-transform:uppercase}
  header h1{margin:6px 0 2px;font-size:24px;letter-spacing:-.5px}
  header p{margin:2px 0 0;color:var(--muted);font-size:14px}
  main{max-width:760px;margin:0 auto;padding:14px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:14px 16px;margin:12px 0}
  .day h2{margin:0 0 2px;font-size:17px;display:flex;align-items:baseline;gap:8px}
  .day .date{font-size:12px;color:var(--muted);font-weight:500}
  .dish{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .dish:first-of-type{border-top:none}
  .tag{flex-shrink:0;width:64px;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.5px;padding-top:3px}
  .tag.main{color:var(--accent)} .tag.soup{color:#c46210}
  .tag.side{color:var(--muted)} .tag.base{color:var(--muted)}
  .dish .body .name{font-weight:600;font-size:15px}
  .dish .body .name .pill{display:inline-block;font-size:10px;font-weight:700;color:#fff;
    border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
  .pill.Thai{background:var(--thai)} .pill.Chinese{background:var(--chinese)}
  .pill.Japanese{background:var(--japanese)} .pill.American{background:var(--american)}
  .dish .body .note{font-size:13px;color:var(--muted);margin-top:1px}
  .toolbar{max-width:760px;margin:0 auto;padding:0 14px;display:flex;gap:8px;justify-content:flex-end}
  .btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;
    padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
  .state{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
  @media print{
    body{background:#fff} .toolbar{display:none} .day{box-shadow:none;break-inside:avoid}
  }
</style>
</head>
<body>
  <header>
    <div class="kicker">🍽️ MenuEngine</div>
    <h1 id="title">Loading menu…</h1>
    <p id="subtitle"></p>
  </header>

  <div class="toolbar">
    <button class="btn" onclick="window.print()">🖨️ Print</button>
  </div>

  <main id="main">
    <div class="state" id="state">Fetching your menu…</div>
  </main>

  <footer>Generated by MenuEngine · share this link, no login needed</footer>

<script src="config.js"></script>
<script src="config.local.js" onerror="void 0"></script>
<script src="api.js"></script>
<script>
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function params(){ return new URLSearchParams(location.search); }
function slug(){
  return params().get("slug")
    || (window.MENUENGINE_CONFIG && window.MENUENGINE_CONFIG.defaultMenuSlug)
    || "";
}
function fmtDate(s){
  if(!s) return "";
  const d = new Date(s + (s.length<=10 ? "T00:00:00" : ""));
  if(isNaN(d)) return s;
  return DOW[d.getDay()] + " · " + MON[d.getMonth()] + " " + d.getDate();
}
function roleOf(note){
  const m = /^\[(\w+)\]/.exec(note || "");
  return m ? m[1].toLowerCase() : "main";
}
function cleanNote(note){ return (note || "").replace(/^\[\w+\]\s*/, ""); }

function render(menu, items){
  document.getElementById("title").textContent = menu.title || "Weekly Menu";
  const start = fmtDate(menu.starts_on);
  document.getElementById("subtitle").textContent =
    (menu.period === "month" ? "Monthly plan" : "Weekly plan") + (start ? " · starting " + start : "");

  // Group by scheduled_date (preserve order via first appearance).
  const order = [];
  const byDate = {};
  items.forEach(function(it){
    const k = it.scheduled_date || "—";
    if(!byDate[k]){ byDate[k] = []; order.push(k); }
    byDate[k].push(it);
  });

  const roleRank = { main:0, soup:1, side:2, base:3 };
  const main = document.getElementById("main");
  main.innerHTML = "";
  order.forEach(function(date){
    const day = document.createElement("div");
    day.className = "day";
    const h = document.createElement("h2");
    h.innerHTML = (date !== "—" ? fmtDate(date) : "Dinner") +
      ' <span class="date"></span>';
    day.appendChild(h);
    byDate[date]
      .sort(function(a,b){ return (roleRank[roleOf(a.notes)]??9) - (roleRank[roleOf(b.notes)]??9); })
      .forEach(function(it){
        const role = roleOf(it.notes);
        const row = document.createElement("div");
        row.className = "dish";
        row.innerHTML =
          '<div class="tag ' + role + '">' + role + '</div>' +
          '<div class="body"><div class="name">' + esc(it.dish_name) +
            (it.cuisine ? ' <span class="pill ' + it.cuisine + '">' + it.cuisine + '</span>' : '') +
          '</div><div class="note">' + esc(cleanNote(it.notes)) + '</div></div>';
        day.appendChild(row);
      });
    main.appendChild(day);
  });
}
function esc(s){ return String(s||"").replace(/[&<>]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

async function load(){
  const s = slug();
  const state = document.getElementById("state");
  if(!window.MENUENGINE_CONFIG || !MENUENGINE_CONFIG.apiUrl){
    state.textContent = "No API configured. Add apiUrl to config.js."; return;
  }
  if(!s){ state.textContent = "No menu specified. Add ?slug=… to the URL."; return; }
  try{
    const res = await MenuEngineAPI.getMenu(s);
    if(!res.ok){ state.textContent = "Menu not found."; document.getElementById("title").textContent="Menu not found"; return; }
    render(res.menu, res.items || []);
  }catch(e){
    state.textContent = "Couldn't load the menu. " + e;
  }
}
load();
</script>
</body>
</html>
