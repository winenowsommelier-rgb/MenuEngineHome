<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MenuEngine</title>
<style>
  :root{
    --bg:#FBFAF7; --surface:#FFFFFF; --ink:#181818; --muted:#8A8578;
    --line:#EDE8E0; --accent:#E8623D; --accent-soft:#FBE9E2;
    --ok:#3AA76D;
    --thai:#E35D6A; --chinese:#D99A00; --japanese:#5B8DEF; --american:#3AA76D; --home:#9A8F7D;
    --shadow:0 1px 2px rgba(40,30,20,.04), 0 8px 24px rgba(40,30,20,.06);
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .screen{display:none; min-height:100vh}
  .screen.active{display:block}
  .wrap{max-width:680px; margin:0 auto; padding:0 18px}

  /* ---------- Login ---------- */
  #login{padding:48px 0 40px}
  .brand{text-align:center; margin-bottom:34px}
  .brand .logo{font-size:30px}
  .brand h1{margin:8px 0 2px; font-size:23px; font-weight:680; letter-spacing:-.4px}
  .brand p{margin:0; color:var(--muted); font-size:15px}
  .who{font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--muted); margin:0 0 12px 2px}
  .members{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:12px}
  .mcard{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 10px; text-align:center; cursor:pointer; box-shadow:var(--shadow);
    transition:transform .12s ease, border-color .12s;
  }
  .mcard:active{transform:scale(.96)}
  .mcard:hover{border-color:#e0d6c8}
  .mcard .av{font-size:30px; line-height:1}
  .mcard .nm{font-weight:620; font-size:14px; margin-top:8px}
  .mcard .cd{display:inline-block; margin-top:6px; font-size:11px; font-weight:700;
    color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 9px}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky; top:0; z-index:20; background:rgba(251,250,247,.86);
    backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line)}
  .topbar .row{display:flex; align-items:center; gap:12px; padding:14px 0 12px}
  .iconbtn{border:1px solid var(--line); background:var(--surface); width:38px; height:38px;
    border-radius:12px; font-size:16px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; flex-shrink:0}
  .greet{flex:1; min-width:0}
  .greet .hi{font-size:17px; font-weight:680; letter-spacing:-.3px; line-height:1.15}
  .greet .sub{font-size:12px; color:var(--muted)}
  .badges{display:flex; gap:6px; flex-wrap:wrap; padding:0 0 12px}
  .badge{font-size:11px; font-weight:600; color:#6b5; border:1px solid var(--line);
    background:var(--surface); border-radius:999px; padding:3px 9px; color:var(--muted)}
  .badge.warn{color:var(--accent); background:var(--accent-soft); border-color:transparent}

  /* ---------- Day nav ---------- */
  .days{display:flex; gap:8px; overflow-x:auto; padding:12px 0 14px; scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto; min-width:52px; text-align:center; padding:8px 6px; border-radius:14px;
    border:1px solid var(--line); background:var(--surface); cursor:pointer; transition:.12s}
  .day .dow{font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px}
  .day .dnum{font-size:17px; font-weight:680; margin-top:1px}
  .day[aria-selected="true"]{background:var(--ink); border-color:var(--ink)}
  .day[aria-selected="true"] .dow,.day[aria-selected="true"] .dnum{color:#fff}

  /* ---------- Meals ---------- */
  .meals{padding:4px 0 120px}
  .meal{margin:18px 0}
  .meal-head{display:flex; align-items:center; gap:8px; margin:0 2px 9px}
  .meal-head .ico{font-size:15px}
  .meal-head .lbl{font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted)}
  .meal-head .qty{margin-left:auto; font-size:12px; font-weight:600; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px 10px}
  .meal-head .qty b{color:var(--accent)}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden; transition:opacity .15s}
  .dish{display:flex; align-items:flex-start; gap:11px; padding:13px 16px; border-top:1px solid var(--line)}
  .dish:first-child{border-top:none}
  .dot{width:9px; height:9px; border-radius:50%; margin-top:6px; flex-shrink:0}
  .dot.Thai{background:var(--thai)} .dot.Chinese{background:var(--chinese)}
  .dot.Japanese{background:var(--japanese)} .dot.American{background:var(--american)}
  .dot.Home{background:var(--home)}
  .dish .d-body{flex:1; min-width:0}
  .dish .d-name{font-weight:620; font-size:15px}
  .dish .d-name .role{font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:var(--muted); margin-left:7px}
  .dish .d-note{font-size:13px; color:var(--muted); margin-top:1px}
  /* per-dish skip toggle */
  .dish-x{flex-shrink:0; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface); color:var(--muted); font-size:16px; line-height:1; cursor:pointer;
    transition:.12s; align-self:center}
  .dish-x:active{transform:scale(.9)}
  .dish.disliked{opacity:.55}
  .dish.disliked .d-name{text-decoration:line-through}
  .dish.disliked .dish-x{background:var(--accent); border-color:var(--accent); color:#fff; transform:rotate(45deg)}
  /* away meal */
  .meal.away .card .dish{opacity:.45}
  .meal.away .card .dish .d-name{text-decoration:line-through}
  .meal.away .dish-x{visibility:hidden}
  .meal-actions{display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:1px solid var(--line); background:#fdfcfa}
  .hint-sm{font-size:12px; color:var(--muted)}
  .awaybtn{margin-left:auto; border:1px solid var(--line); background:var(--surface); color:var(--muted);
    border-radius:999px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; transition:.12s;
    display:flex; align-items:center; gap:6px}
  .awaybtn:active{transform:scale(.96)}
  .meal.away .awaybtn{background:var(--ink); border-color:var(--ink); color:#fff}
  .you{font-size:12px; color:var(--ink); font-weight:600}

  /* ---------- Bottom bar ---------- */
  .bottombar{position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:rgba(251,250,247,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
  .bottombar .inner{max-width:680px; margin:0 auto; display:flex; align-items:center; gap:12px}
  .bottombar .count{font-size:14px; color:var(--muted)}
  .bottombar .count b{color:var(--ink)}
  .btn{border:none; border-radius:14px; padding:13px 20px; font-size:15px; font-weight:650;
    cursor:pointer; transition:.12s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent); color:#fff; margin-left:auto}
  .btn.block{width:100%; margin:0}

  /* ---------- Thanks ---------- */
  #thanks{display:none; place-items:center; min-height:100vh; text-align:center; padding:30px}
  #thanks.active{display:grid}
  #thanks .big{font-size:54px}
  #thanks h2{margin:14px 0 6px; font-size:22px; font-weight:680}
  #thanks p{margin:0 0 22px; color:var(--muted); max-width:340px}

  .footnote{text-align:center; color:var(--muted); font-size:11px; padding:8px 0 26px}

  /* ---------- Dish detail modal ---------- */
  .d-body{cursor:pointer}
  .d-name .info{font-size:11px;color:var(--muted);margin-left:6px;opacity:.7}
  .modal-bg{position:fixed; inset:0; background:rgba(24,18,12,.5); z-index:60; display:none;
    align-items:flex-end; justify-content:center; padding:0}
  .modal-bg.show{display:flex}
  .sheet{background:var(--surface); width:100%; max-width:680px; border-radius:22px 22px 0 0;
    max-height:90vh; overflow-y:auto; box-shadow:0 -8px 40px rgba(0,0,0,.2); animation:slideup .22s ease}
  @keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet .hero{height:200px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .sheet .hero img{width:100%;height:100%;object-fit:cover}
  .sheet .hero .bigemoji{font-size:72px}
  .sheet .close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;
    border:none;background:rgba(255,255,255,.9);font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
  .sheet .pad{padding:18px 18px 26px}
  .sheet h3{margin:0 0 2px;font-size:21px;letter-spacing:-.3px}
  .sheet .cz{font-size:13px;color:var(--muted);margin-bottom:12px}
  .sheet .desc{font-size:15px;line-height:1.55;margin:0 0 14px}
  .sheet .lbl2{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
  .sheet .ing{font-size:14px;color:var(--ink)}
  .sheet .ing ul{margin:4px 0 0;padding-left:18px}
  .sheet .ing li{margin:2px 0}
  .sheet .nutri{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 4px}
  .sheet .nutri .np{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center;min-width:64px}
  .sheet .nutri .np b{display:block;font-size:16px;letter-spacing:-.3px}
  .sheet .nutri .np span{font-size:11px;color:var(--muted)}
  .sheet .nutri .np.hi b{color:var(--ok)}
  .sheet .steps{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.55}
  .sheet .steps li{margin:4px 0}
  .sheet .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .sheet .tg{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
  .sheet .media{display:flex;gap:10px;margin-top:18px}
  .sheet .media a{flex:1;text-align:center;text-decoration:none;border-radius:12px;padding:12px;font-size:14px;font-weight:650}
  .sheet .media .yt{background:#ff3b30;color:#fff}
  .sheet .media .ph{background:var(--ink);color:#fff}
  .sheet .none{font-size:14px;color:var(--muted)}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<section class="screen active" id="login">
  <div class="wrap">
    <div class="brand">
      <div class="logo">🍽️</div>
      <h1>MenuEngine</h1>
      <p>Next week's menu is ready to review</p>
    </div>
    <p class="who">Who's checking?</p>
    <div class="members" id="memberGrid"></div>
    <div class="footnote" id="loginNote">Tap your name. No password needed.</div>
  </div>
</section>

<!-- ========== WEEK ========== -->
<section class="screen" id="week">
  <div class="topbar">
    <div class="wrap">
      <div class="row">
        <button class="iconbtn" id="switchUser" title="Switch person">←</button>
        <div class="greet">
          <div class="hi" id="greetName">Hi</div>
          <div class="sub">Reviewing · Week of Jun 8–14</div>
        </div>
      </div>
      <div class="badges" id="badges"></div>
      <div class="days" id="dayNav"></div>
    </div>
  </div>
  <div class="wrap">
    <div class="meals" id="meals"></div>
  </div>
  <div class="bottombar">
    <div class="inner">
      <div class="count"><b id="flagCount">0</b> · <span id="flagLabel">nothing flagged</span></div>
      <button class="btn primary" id="sendBtn">Send my feedback</button>
    </div>
  </div>
</section>

<!-- ========== THANKS ========== -->
<section class="screen" id="thanks">
  <div>
    <div class="big">🌿</div>
    <h2>Thanks, <span id="thanksName">friend</span>!</h2>
    <p id="thanksMsg">Your picks are in. The admin will review everyone's feedback and finalize the week.</p>
    <button class="btn primary block" id="backBtn">Back to my week</button>
  </div>
</section>

<!-- ========== DISH DETAIL ========== -->
<div class="modal-bg" id="dishModal">
  <div class="sheet">
    <div class="hero" id="dishHero"></div>
    <button class="close" id="dishClose">✕</button>
    <div class="pad">
      <h3 id="dishName"></h3>
      <div class="cz" id="dishCuisine"></div>
      <p class="desc" id="dishDesc"></p>
      <div class="nutri" id="dishNutri"></div>
      <div id="dishIngWrap"><div class="lbl2">What's in it</div><div class="ing" id="dishIng"></div></div>
      <div id="dishStepsWrap"><div class="lbl2">How it's made</div><ol class="steps" id="dishSteps"></ol></div>
      <div class="tags" id="dishTags"></div>
      <div class="media" id="dishMedia"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="config.local.js" onerror="void 0"></script>
<script src="api.js"></script>
<script>
/* ============================ Sample data (fallback) ============================
   Used until the backend has a published week. Once the Google Sheet has data
   for WEEK_START, the app loads it live and replaces these. */
const WEEK_START = "2026-06-08";
const SAMPLE_MEMBERS = [
  {code:"GGM", name:"Grandmom", av:"👵", factor:0.6, lunchWeekday:"home", badges:["Soft food","Mild"]},
  {code:"D",   name:"Dad",      av:"🧔", factor:1.0, lunchWeekday:"home", badges:["No beef","Spicy OK 🌶️","Low sugar"]},
  {code:"M",   name:"Mom",      av:"👩", factor:0.9, lunchWeekday:"home", badges:["No beef","No raw fish","Comfort"]},
  {code:"N1",  name:"New",      av:"🧑", factor:1.5, lunchWeekday:"away", badges:["No fish","High protein","More fiber"]},
  {code:"N2",  name:"Now",      av:"👨", factor:1.4, lunchWeekday:"away", badges:["High protein"]},
  {code:"N3",  name:"Knight",   av:"👨", factor:1.5, lunchWeekday:"away", badges:["High protein"]},
  {code:"N4",  name:"Net",      av:"👨", factor:1.5, lunchWeekday:"away", badges:["High protein"]},
  {code:"N5",  name:"Note",     av:"🩰", factor:1.0, lunchWeekday:"away", badges:["High protein","Ballet"]},
  {code:"N6",  name:"Neon",     av:"👧", factor:0.7, lunchWeekday:"away", badges:["Kid","Mild"]},
  {code:"N7",  name:"Neo",      av:"🧒", factor:0.4, lunchWeekday:"home", badges:["Toddler","Soft"]},
  {code:"L",   name:"Lookaew",  av:"👩‍🦰", factor:0.9, lunchWeekday:"away", badges:[]},
];

const MEAL_WEIGHT = {breakfast:0.8, lunch:0.9, dinner:1.0};
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// 7 days, each with breakfast/lunch/dinner -> dishes {n, c, r, note}
const SAMPLE_WEEK = [
  { date:"2026-06-08",
    breakfast:[{n:"Chicken congee",c:"Chinese",r:"soft",note:"Gentle & warm to start"},{n:"Boiled eggs",c:"Home",r:"protein"},{n:"Papaya",c:"Home",r:"fruit"}],
    lunch:[{n:"Khao Man Gai",c:"Thai",r:"main",note:"Poached chicken & rice"},{n:"Cucumber",c:"Home",r:"veg"}],
    dinner:[{n:"Pad Krapow Gai",c:"Thai",r:"main",note:"Chili on the side"},{n:"Tom Kha Gai",c:"Thai",r:"soft"},{n:"Som Tum",c:"Thai",r:"veg"}] },
  { date:"2026-06-09",
    breakfast:[{n:"Soft-boiled eggs",c:"Home",r:"protein"},{n:"Multigrain toast",c:"American",r:"base"},{n:"Soy milk",c:"Home",r:"drink"}],
    lunch:[{n:"Wonton Noodle Soup",c:"Chinese",r:"main",note:"Light & soft"}],
    dinner:[{n:"Chicken Teriyaki",c:"Japanese",r:"main",note:"Low-sugar glaze"},{n:"Yakitori",c:"Japanese",r:"protein"},{n:"Japanese Curry (mild)",c:"Japanese",r:"soft"},{n:"Miso Soup",c:"Japanese",r:"soup"}] },
  { date:"2026-06-10",
    breakfast:[{n:"Century-egg congee",c:"Chinese",r:"soft"},{n:"Youtiao",c:"Chinese",r:"base"}],
    lunch:[{n:"Yangzhou Fried Rice",c:"Chinese",r:"main",note:"With shrimp & chicken"}],
    dinner:[{n:"Kung Pao Chicken",c:"Chinese",r:"main",note:"Chili on the side"},{n:"Mapo Tofu",c:"Chinese",r:"protein"},{n:"Garlic Greens",c:"Chinese",r:"veg"}] },
  { date:"2026-06-11",
    breakfast:[{n:"Oatmeal & fruit",c:"American",r:"soft"},{n:"Scrambled eggs",c:"Home",r:"protein"}],
    lunch:[{n:"Cobb Salad",c:"American",r:"main",note:"Protein + fiber"}],
    dinner:[{n:"Roast Chicken",c:"American",r:"main"},{n:"Mac & Cheese",c:"American",r:"soft"},{n:"Grilled Cheese & Tomato Soup",c:"American",r:"soft"}] },
  { date:"2026-06-12",
    breakfast:[{n:"Jok (rice porridge)",c:"Thai",r:"soft",note:"With minced pork"}],
    lunch:[{n:"Pad See Ew",c:"Thai",r:"main"}],
    dinner:[{n:"Massaman Chicken",c:"Thai",r:"main",note:"Tender & mild"},{n:"Tom Yum Goong",c:"Thai",r:"soup",note:"Shrimp — heat adjustable"},{n:"Chicken Satay",c:"Thai",r:"protein"}] },
  { date:"2026-06-13",
    breakfast:[{n:"Pancakes",c:"American",r:"base"},{n:"Eggs & fruit",c:"Home",r:"protein"}],
    lunch:[{n:"Udon Noodle Soup",c:"Japanese",r:"soft"}],
    dinner:[{n:"Tonkatsu / Katsudon",c:"Japanese",r:"main",note:"Katsudon is the soft option"},{n:"Miso Soup",c:"Japanese",r:"soup"},{n:"Seaweed salad",c:"Japanese",r:"veg"}] },
  { date:"2026-06-14",
    breakfast:[{n:"Dim sum brunch",c:"Chinese",r:"main",note:"Congee + dumplings"}],
    lunch:[{n:"Fruit & cook's share",c:"Home",r:"soft",note:"Light — feast tonight"}],
    dinner:[{n:"Char Siu",c:"Chinese",r:"main"},{n:"Sweet & Sour Pork",c:"Chinese",r:"main",note:"Low-sugar"},{n:"Pork Dumplings + Gyoza",c:"Chinese",r:"protein"},{n:"Yangzhou Fried Rice",c:"Chinese",r:"base"},{n:"Fresh fruit",c:"Home",r:"dessert"}] },
];

const MEAL_ICON = {breakfast:"☀️", lunch:"🍵", dinner:"🌙"};

/* ============================ Live data ============================ */
let MEMBERS = SAMPLE_MEMBERS.slice();
let WEEK = SAMPLE_WEEK.slice();
let dataSource = "preview";   // "preview" | "live"

function deriveAvatar(m){
  const age = Number(m.age)||0, f = (m.sex||"").toUpperCase()==="F";
  if(age && age<6) return "🧒";
  if(age && age<14) return f ? "👧" : "👦";
  if(age && age>=75) return f ? "👵" : "👴";
  return f ? "👩" : (m.sex ? "👨" : "🧑");
}
function deriveBadges(m){
  const b = [];
  const dis = String(m.dislikes||"").split("|").filter(Boolean);
  dis.forEach(function(d){ b.push("No " + d); });
  const h = String(m.health||"").toLowerCase();
  if(/diabet|เบาหวาน/.test(h)) b.push("Low sugar");
  if(Number(m.spice_level) >= 3) b.push("Spicy OK 🌶️");
  if(/soft/.test(String(m.texture||"").toLowerCase())) b.push("Soft food");
  if(/protein/.test(String(m.goals||"").toLowerCase())) b.push("High protein");
  if(/fiber/.test(String(m.goals||"").toLowerCase())) b.push("More fiber");
  return b;
}
function mapMembers(api){
  return api.map(function(m){
    return {
      code: m.code || "", name: m.name || "Member", av: deriveAvatar(m),
      factor: Number(m.portion_factor)||1.0,
      lunchWeekday: m.lunch_weekday || "home",
      badges: deriveBadges(m)
    };
  }).filter(function(m){ return m.code; });
}
function mapWeek(meals){
  const byDate = {};
  const order = [];
  meals.forEach(function(meal){
    const d = meal.date;
    if(!byDate[d]){ byDate[d] = { date:d, breakfast:[], lunch:[], dinner:[] }; order.push(d); }
    const dishes = (meal.dishes||[]).map(function(x){
      return { n:x.dish_name, c:x.cuisine||"Home", r:x.role||"", note:x.notes||"" };
    });
    if(byDate[d][meal.meal_type]) byDate[d][meal.meal_type] = dishes;
  });
  order.sort();
  return order.map(function(d){ return byDate[d]; });
}

async function loadData(){
  if(!(window.MenuEngineAPI && MenuEngineAPI.hasApi() &&
       window.MENUENGINE_CONFIG && MENUENGINE_CONFIG.householdSlug)) return;
  try{
    const res = await MenuEngineAPI.getWeek(MENUENGINE_CONFIG.householdSlug, WEEK_START);
    if(res && res.ok){
      if(res.members && res.members.length) MEMBERS = mapMembers(res.members);
      if(res.meals && res.meals.length) { WEEK = mapWeek(res.meals); dataSource = "live"; }
    }
  }catch(e){ /* keep preview data */ }
}

/* ============================ State ============================ */
let me = null;          // current member
let dayIdx = 1;         // default to Monday
let away = {};          // { "date|meal": true }  — not eating this meal at all
let dislikes = {};      // { "date|meal|dish": true } — present but won't eat this dish

function mkey(date, meal){ return date + "|" + meal; }
function dkey(date, meal, dish){ return date + "|" + meal + "|" + dish; }
function roundHalfUp(x){ return Math.ceil(x*2)/2; }
function isWeekend(date){ const g=new Date(date+"T00:00:00").getDay(); return g===0||g===6; }
// Everyone is counted for every meal by default. Only an explicit "I'm away"
// vote removes a member's portion from that meal.
function attendees(meal, date){ return MEMBERS.slice(); }
function isAttendee(m, meal, date){ return true; }

/* ============================ Login ============================ */
function renderLogin(){
  const g = document.getElementById("memberGrid");
  g.innerHTML = "";
  MEMBERS.forEach(m=>{
    const el = document.createElement("button");
    el.className = "mcard";
    el.innerHTML = `<div class="av">${m.av}</div><div class="nm">${m.name}</div>
      <div class="cd">${m.code}</div>`;
    el.addEventListener("click", ()=>enter(m));
    g.appendChild(el);
  });
}

function enter(m){
  me = m;
  const saved = loadVetoes(m.code);
  away = saved.away || {};
  dislikes = saved.dislikes || {};
  document.getElementById("greetName").textContent = "Hi " + m.name.split(" ")[0];
  const b = document.getElementById("badges");
  b.innerHTML = "";
  (m.badges.length ? m.badges : ["No restrictions"]).forEach(t=>{
    const span = document.createElement("span");
    const warn = /no |low |soft|mild/i.test(t);
    span.className = "badge" + (warn ? " warn" : "");
    span.textContent = t;
    b.appendChild(span);
  });
  renderDays(); renderDay(); updateFlag();
  show("week");
}

/* ============================ Day nav ============================ */
function renderDays(){
  const nav = document.getElementById("dayNav");
  nav.innerHTML = "";
  WEEK.forEach((d,i)=>{
    const dt = new Date(d.date+"T00:00:00");
    const el = document.createElement("button");
    el.className = "day";
    el.setAttribute("aria-selected", String(i===dayIdx));
    el.innerHTML = `<div class="dow">${DOW[dt.getDay()]}</div><div class="dnum">${dt.getDate()}</div>`;
    el.addEventListener("click", ()=>{ dayIdx=i; renderDays(); renderDay(); });
    nav.appendChild(el);
  });
}

/* ============================ Meals ============================ */
function renderDay(){
  const day = WEEK[dayIdx];
  const host = document.getElementById("meals");
  host.innerHTML = "";
  ["breakfast","lunch","dinner"].forEach(meal=>{
    const dishes = day[meal] || [];
    if(!dishes.length) return;
    const isAway = !!away[mkey(day.date, meal)];

    // cook quantity: full house by default, minus me if I'm away
    const present = attendees(meal, day.date);
    let raw = present.reduce((s,m)=>s+m.factor,0);
    if(isAway) raw -= me.factor;
    const cook = roundHalfUp(Math.max(raw,0));

    const sec = document.createElement("div");
    sec.className = "meal" + (isAway ? " away" : "");

    let dishHtml = dishes.map((d,di)=>{
      const note = personalNote(d, meal);
      const disliked = !!dislikes[dkey(day.date, meal, d.n)];
      return `<div class="dish ${disliked?"disliked":""}" data-di="${di}">
        <span class="dot ${d.c}"></span>
        <div class="d-body" data-dish="${esc(d.n)}">
          <div class="d-name">${esc(d.n)}<span class="role">${esc(d.r||"")}</span><span class="info">ⓘ</span></div>
          ${note ? `<div class="d-note">${esc(note)}</div>` : ""}
        </div>
        <button class="dish-x" data-dish="${esc(d.n)}" title="Not for me">
          ${disliked ? "✕" : "＋"}
        </button>
      </div>`;
    }).join("");

    sec.innerHTML = `
      <div class="meal-head">
        <span class="ico">${MEAL_ICON[meal]}</span>
        <span class="lbl">${meal}</span>
        <span class="qty">Cook <b>~${cook}</b> servings</span>
      </div>
      <div class="card">
        ${dishHtml}
        <div class="meal-actions">
          ${isAway ? `<span class="you">🚶 You're away — we won't cook for you</span>`
                   : `<span class="hint-sm">Tap ✕ on a dish you'd skip</span>`}
          <button class="awaybtn" data-key="${mkey(day.date,meal)}">
            ${isAway ? "✓ Away" : "🚶 I'm away"}
          </button>
        </div>
      </div>`;
    host.appendChild(sec);
  });

  // per-dish "not for me"
  host.querySelectorAll(".dish-x").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const sec = btn.closest(".meal");
      // find which day/meal via order: recompute from DOM index
      const dish = btn.dataset.dish;
      const mealName = sec.querySelector(".lbl").textContent.trim().split(" ")[0];
      const k = dkey(day.date, mealName, dish);
      if(dislikes[k]) delete dislikes[k]; else dislikes[k]=true;
      persist(); renderDay(); updateFlag();
    });
  });
  // meal "I'm away"
  host.querySelectorAll(".awaybtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.dataset.key;
      if(away[k]) delete away[k]; else away[k]=true;
      persist(); renderDay(); updateFlag();
    });
  });
  // tap a dish to see details
  host.querySelectorAll(".d-body").forEach(b=>{
    b.addEventListener("click", ()=> openDishModal(b.dataset.dish));
  });
}

/* ============================ Dish library + detail modal ============================ */
let DISHES = [];
async function loadDishes(){
  try{ const r = await fetch("data/dishes.json"); const j = await r.json(); DISHES = j.dishes || []; }
  catch(e){ DISHES = []; }
}
function dtokens(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2); }
function lookupDish(name){
  const nt = dtokens(name); let best=null, score=0;
  DISHES.forEach(d=>{
    const dt = dtokens(d.name);
    let sc = dt.filter(w=>nt.includes(w)).length;
    if(d.name.toLowerCase()===String(name||"").toLowerCase()) sc += 10;
    if(sc>score){ score=sc; best=d; }
  });
  return score>0 ? best : null;
}
function ytLink(n){ return "https://www.youtube.com/results?search_query="+encodeURIComponent(n+" recipe"); }
function phLink(n){ return "https://www.google.com/search?tbm=isch&q="+encodeURIComponent(n+" food dish"); }
function imgUrl(n){ return "https://loremflickr.com/600/360/"+encodeURIComponent(dtokens(n).join(",")+",food"); }

function openDishModal(name){
  const d = lookupDish(name);
  const title = d ? d.name : name;
  const emoji = (d && d.emoji) ? d.emoji : "🍽️";
  document.getElementById("dishName").textContent = title;
  document.getElementById("dishCuisine").textContent = d ? d.cuisine : "";
  document.getElementById("dishDesc").textContent = d ? d.desc
    : "No description yet — tap below to see photos or a video of this dish.";
  // nutrition (per serving)
  const nu = document.getElementById("dishNutri");
  if(d && d.nutrition){
    const n = d.nutrition;
    nu.style.display = "flex";
    nu.innerHTML =
      `<div class="np"><b>${n.kcal}</b><span>kcal</span></div>
       <div class="np hi"><b>${n.protein_g}g</b><span>protein</span></div>
       <div class="np hi"><b>${n.fiber_g}g</b><span>fiber</span></div>
       <div class="np"><b>${n.carbs_g}g</b><span>carbs</span></div>
       <div class="np"><b>${n.fat_g}g</b><span>fat</span></div>`;
  } else nu.style.display = "none";
  // ingredients — structured list if available, else text
  const ingWrap = document.getElementById("dishIngWrap");
  const ing = document.getElementById("dishIng");
  if(d && Array.isArray(d.items) && d.items.length){
    ingWrap.style.display="block";
    ing.innerHTML = "<ul>" + d.items.map(it=>`<li>${esc((it.qty!=null?it.qty+" ":"")+(it.unit?it.unit+" ":"")+it.item)}</li>`).join("") + "</ul>";
  } else if(d && d.ingredients){ ingWrap.style.display="block"; ing.textContent = d.ingredients; }
  else ingWrap.style.display="none";
  // steps
  const stWrap = document.getElementById("dishStepsWrap");
  if(d && Array.isArray(d.steps) && d.steps.length){
    stWrap.style.display="block";
    document.getElementById("dishSteps").innerHTML = d.steps.map(s=>`<li>${esc(s)}</li>`).join("");
  } else stWrap.style.display="none";
  const tg = document.getElementById("dishTags"); tg.innerHTML="";
  ((d && d.tags) || []).forEach(t=>{ const s=document.createElement("span"); s.className="tg"; s.textContent=t; tg.appendChild(s); });
  const hero = document.getElementById("dishHero");
  hero.innerHTML = `<img id="dishImg" alt="">`;
  const img = document.getElementById("dishImg");
  img.onerror = ()=>{ hero.innerHTML = `<span class="bigemoji">${emoji}</span>`; };
  img.src = imgUrl(title);
  document.getElementById("dishMedia").innerHTML =
    `<a class="yt" href="${ytLink(title)}" target="_blank" rel="noopener">▶ Watch on YouTube</a>
     <a class="ph" href="${phLink(title)}" target="_blank" rel="noopener">📷 See photos</a>`;
  document.getElementById("dishModal").classList.add("show");
}
document.getElementById("dishClose").addEventListener("click", ()=>document.getElementById("dishModal").classList.remove("show"));
document.getElementById("dishModal").addEventListener("click", e=>{ if(e.target.id==="dishModal") document.getElementById("dishModal").classList.remove("show"); });

// Light personalization: surface the note most relevant to the current member.
function personalNote(d, meal){
  if(!me) return d.note || "";
  const t = (d.n + " " + (d.note||"")).toLowerCase();
  if(me.code==="D" && /chili|spicy|kung pao|krapow|tom yum/.test(t)) return "You can have it hot 🌶️ — " + (d.note||"chili on the side");
  if((me.code==="GGM"||me.code==="N7") && (d.r==="soft"||/congee|porridge|soup|tofu|udon|mac/.test(t))) return "Soft & easy for you" + (d.note?` · ${d.note}`:"");
  if(/protein|high protein/.test(me.badges.join(" ").toLowerCase()) && (d.r==="protein"||d.r==="main")) return (d.note?d.note+" · ":"") + "good protein for training";
  return d.note || "";
}

function updateFlag(){
  const a = Object.keys(away).length, d = Object.keys(dislikes).length;
  const el = document.getElementById("flagCount");
  el.textContent = (a + d);
  const lbl = document.getElementById("flagLabel");
  if(lbl) lbl.textContent = (a||d)
    ? `${a} away · ${d} dish${d===1?"":"es"} skipped`
    : "nothing flagged";
}

/* ============================ Persistence (prototype) ============================ */
function loadVetoes(code){
  try{ return JSON.parse(localStorage.getItem("menuengine.votes."+code)) || {}; }
  catch(e){ return {}; }
}
function persist(){ localStorage.setItem("menuengine.votes."+me.code, JSON.stringify({away:away, dislikes:dislikes})); }

/* ============================ Nav ============================ */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}
document.getElementById("switchUser").addEventListener("click", ()=>show("login"));
document.getElementById("sendBtn").addEventListener("click", async ()=>{
  const list = [];
  Object.keys(away).forEach(k=>{ const p=k.split("|"); list.push({date:p[0], meal_type:p[1], vote:"away", dish_name:""}); });
  Object.keys(dislikes).forEach(k=>{ const p=k.split("|"); list.push({date:p[0], meal_type:p[1], vote:"dislike", dish_name:p.slice(2).join("|")}); });
  const sendBtn = document.getElementById("sendBtn");
  if(window.MenuEngineAPI && MenuEngineAPI.hasApi() && window.MENUENGINE_CONFIG && MENUENGINE_CONFIG.householdSlug){
    sendBtn.textContent = "Sending…"; sendBtn.disabled = true;
    try{
      await MenuEngineAPI.submitVotes({ slug: MENUENGINE_CONFIG.householdSlug,
        member_code: me.code, week_start: WEEK_START, vetoes: list });
    }catch(e){ /* still show thanks; localStorage keeps a copy */ }
    sendBtn.textContent = "Send my feedback"; sendBtn.disabled = false;
  }
  document.getElementById("thanksName").textContent = me.name.split(" ")[0];
  const a = Object.keys(away).length, d = Object.keys(dislikes).length;
  document.getElementById("thanksMsg").textContent = (a||d)
    ? `Got it — ${a} meal${a===1?"":"s"} you're away, ${d} dish${d===1?"":"es"} to skip. The admin will review and adjust the menu.`
    : `Looks like everything works for you! The admin will finalize the week soon.`;
  show("thanks");
});
document.getElementById("backBtn").addEventListener("click", ()=>show("week"));

function esc(s){ return String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

renderLogin();
loadDishes();
loadData().then(()=>{
  renderLogin();
  if(me){ renderDays(); renderDay(); updateFlag(); }
  const note = document.getElementById("loginNote");
  if(note) note.textContent = dataSource==="live"
    ? "Showing next week's menu · live"
    : "Preview menu — publish a week to go live";
});
</script>
